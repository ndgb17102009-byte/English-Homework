<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Homework</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263248;
        }

        header {
            background: #3156a3;
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .exercise {
            background: white;
            padding: 22px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .exercise h3 {
            margin: 0 0 8px;
        }

        .exercise p {
            color: #64748b;
            margin: 0;
        }

        .empty {
            text-align: center;
            padding: 35px 20px;
            background: white;
            border-radius: 12px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>English Homework</h1>
        <p>Learn English – Practice Every Day!</p>
    </header>

    <main>
        <h2 class="section-title">📚 Danh sách bài tập</h2>

        <div class="empty">
            <h3>Chưa có bài tập nào!</h3>
            <p>Các bài tập mới sẽ được cập nhật tại đây.</p>
        </div>
    </main>

    <footer>
        English Homework © 2026
    </footer>

</body>
</html>
