
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Homework</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263248;
        }

        header {
            background: #3156a3;
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        header p { margin: 0; opacity: .9; }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .section-title { margin-bottom: 20px; }

        #exercise-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .exercise {
            background: white;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .exercise h3 {
            margin: 0 0 12px;
            color: #3156a3;
        }

        .exercise p {
            color: #64748b;
            line-height: 1.5;
            margin: 0 0 16px;
        }

        .exercise-button {
            display: inline-block;
            padding: 10px 18px;
            background: #3156a3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .exercise-button:hover { background: #24427e; }

        .status {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #64748b;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>English Homework</h1>
    <p>Learn English – Practice Every Day!</p>
</header>

<main>
    <h2 class="section-title">📚 Danh sách bài tập</h2>
    <div id="exercise-list">
        <div class="status">Đang tải danh sách bài tập...</div>
    </div>
</main>

<footer>
    English Homework © 2026
</footer>

<script>
const API_URL =
    "https://api.github.com/repos/ndgb17102009-byte/English-Homework/contents/exercises?ref=main";

function formatTitle(filename) {
    return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
}

function showMessage(message) {
    document.getElementById("exercise-list").innerHTML =
        `<div class="status">${message}</div>`;
}

async function loadExercises() {
    const container = document.getElementById("exercise-list");

    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Không thể lấy danh sách bài tập.");
        }

        const files = await response.json();

        const exercises = files
            .filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".html")
            )
            .sort((a, b) => a.name.localeCompare(b.name));

        if (exercises.length === 0) {
            showMessage("Hiện chưa có bài tập nào.");
            return;
        }

        container.innerHTML = "";

        exercises.forEach(file => {
            const card = document.createElement("article");
            card.className = "exercise";

            const title = document.createElement("h3");
            title.textContent = formatTitle(file.name);

            const description = document.createElement("p");
            description.textContent =
                "Bài tập luyện tập tiếng Anh. Nhấn bên dưới để bắt đầu.";

            const link = document.createElement("a");
            link.className = "exercise-button";
            link.href = "./exercises/" +
                encodeURIComponent(file.name);
            link.textContent = "Mở bài tập →";

            card.append(title, description, link);
            container.appendChild(card);
        });

    } catch (error) {
        showMessage(
            "Không tải được danh sách bài tập. " +
            "Vui lòng tải lại trang sau ít phút."
        );
        console.error(error);
    }
}

loadExercises();
</script>

</body>
</html>
